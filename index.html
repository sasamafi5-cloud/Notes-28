<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beleške - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      background: linear-gradient(135deg, #3b82f6, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .theme-buttons {
      display: flex;
      gap: 8px;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      cursor: pointer;
      font-size: 20px;
    }

    .categories {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .category {
      flex: 1;
      padding: 20px;
      border-radius: 20px;
      background: #1e293b;
      text-align: center;
      cursor: pointer;
      border: 1px solid #334155;
    }

    .category.active {
      border-color: #3b82f6;
      box-shadow: 0 0 15px #3b82f6;
    }

    .category-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .badge {
      background: #3b82f6;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      display: inline-block;
      margin-top: 8px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      color: #f1f5f9;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      color: white;
    }

    .delete-btn {
      background: #ef4444;
    }

    .save-btn {
      background: #22c55e;
    }

    .tool-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .tool-btn {
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 24px;
      cursor: pointer;
      flex: none;
    }

    .notes-list {
      background: #1e293b;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .notes-header {
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .notes-items {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s;
    }

    .notes-items.open {
      max-height: 300px;
      overflow-y: auto;
    }

    .note-item {
      padding: 12px 16px;
      border-top: 1px solid #334155;
      cursor: pointer;
    }

    .note-item.active {
      background: #3b82f6;
    }

    .note-text {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-date {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
    }

    .search-overlay.open {
      visibility: visible;
    }

    .search-box {
      background: #1e293b;
      border-radius: 24px;
      width: 90%;
      max-width: 400px;
      overflow: hidden;
    }

    .search-box input {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
    }

    .search-results {
      max-height: 400px;
      overflow-y: auto;
    }

    .search-result {
      padding: 12px 16px;
      border-top: 1px solid #334155;
      cursor: pointer;
    }

    .stats {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 20px;
      right: 20px;
      background: #1e293b;
      padding: 12px;
      border-radius: 40px;
      text-align: center;
      border: 1px solid #3b82f6;
      transform: translateY(100px);
      transition: transform 0.3s;
      z-index: 1100;
    }

    .toast.show {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 Beleške</h1>
    <div class="theme-buttons">
      <button class="theme-btn" data-theme="dark">🌙</button>
      <button class="theme-btn" data-theme="light">☀️</button>
      <button class="theme-btn" data-theme="neon">👑</button>
    </div>
  </div>

  <div class="categories">
    <div class="category" data-cat="licno">
      <div class="category-icon">📁</div>
      <div>Lično</div>
      <div class="badge" id="licnoBadge">0</div>
    </div>
    <div class="category" data-cat="dokumenta">
      <div class="category-icon">📄</div>
      <div>Dokumenta</div>
      <div class="badge" id="dokBadge">0</div>
    </div>
  </div>

  <div class="notes-list">
    <div class="notes-header">
      <span id="notesHeader">📋 Sačuvane beleške (0)</span>
      <span id="notesToggle">▼</span>
    </div>
    <div class="notes-items" id="notesItems">
      <div style="padding: 16px; text-align: center; color: #94a3b8;">Nema beleški</div>
    </div>
  </div>

  <textarea id="editor" placeholder="Ovde upišite belešku..."></textarea>

  <div class="stats">
    <span id="charCount">0 karaktera</span>
    <span id="wordCount">0 reči</span>
  </div>

  <div class="action-buttons">
    <button class="delete-btn" id="deleteBtn">🗑️ OBRIŠI</button>
    <button class="save-btn" id="saveBtn">💾 SAČUVAJ</button>
  </div>

  <div class="tool-buttons">
    <button class="tool-btn" id="searchBtn">🔍</button>
    <button class="tool-btn" id="exportBtn">📎</button>
    <button class="tool-btn" id="shareBtn">📤</button>
  </div>

  <div id="searchOverlay" class="search-overlay">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Pretraži beleške..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div id="toast" class="toast">Poruka</div>

  <script>
    // ==================== DATA ====================
    let currentCategory = 'licno';
    let currentNoteId = null;
    let currentText = '';
    let notes = { licno: [], dokumenta: [] };
    let theme = localStorage.getItem('theme') || 'dark';

    // ==================== HELPERS ====================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function saveToLocalStorage() {
      localStorage.setItem('notes_app', JSON.stringify(notes));
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('notes_app');
      if (saved) {
        notes = JSON.parse(saved);
      }
    }

    function updateUI() {
      // Update badges
      document.getElementById('licnoBadge').textContent = notes.licno.length;
      document.getElementById('dokBadge').textContent = notes.dokumenta.length;
      
      // Update category active state
      document.querySelectorAll('.category').forEach(el => {
        if (el.dataset.cat === currentCategory) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
      
      // Update notes list
      const currentNotes = notes[currentCategory];
      document.getElementById('notesHeader').textContent = `📋 Sačuvane beleške (${currentNotes.length})`;
      
      const container = document.getElementById('notesItems');
      if (currentNotes.length === 0) {
        container.innerHTML = '<div style="padding: 16px; text-align: center; color: #94a3b8;">Nema beleški</div>';
      } else {
        container.innerHTML = currentNotes.map(n => `
          <div class="note-item ${currentNoteId === n.id ? 'active' : ''}" data-id="${n.id}">
            <div class="note-text">${escapeHtml(n.text.substring(0, 60))}</div>
            <div class="note-date">${new Date(n.updatedAt).toLocaleString()}</div>
          </div>
        `).join('');
        
        document.querySelectorAll('.note-item').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.dataset.id;
            const note = currentNotes.find(n => n.id === id);
            if (note) {
              currentNoteId = note.id;
              currentText = note.text;
              document.getElementById('editor').value = currentText;
              updateUI();
            }
          });
        });
      }
      
      // Update editor
      const editor = document.getElementById('editor');
      if (editor.value !== currentText) {
        editor.value = currentText;
      }
      
      // Update stats
      document.getElementById('charCount').textContent = currentText.length + ' karaktera';
      const words = currentText.trim() ? currentText.trim().split(/\s+/).length : 0;
      document.getElementById('wordCount').textContent = words + ' reči';
      
      // Update buttons
      const hasText = currentText.trim().length > 0;
      document.getElementById('deleteBtn').disabled = !hasText || !currentNoteId;
      document.getElementById('saveBtn').disabled = !hasText;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // ==================== ACTIONS ====================
    function saveNote() {
      if (!currentText.trim()) {
        showToast('Nema teksta za čuvanje');
        return;
      }
      
      const now = Date.now();
      let note;
      
      if (currentNoteId) {
        const existing = notes[currentCategory].find(n => n.id === currentNoteId);
        if (existing) {
          note = { ...existing, text: currentText, updatedAt: now };
        } else {
          note = {
            id: Date.now() + '-' + Math.random(),
            category: currentCategory,
            text: currentText,
            createdAt: now,
            updatedAt: now
          };
        }
      } else {
        note = {
          id: Date.now() + '-' + Math.random(),
          category: currentCategory,
          text: currentText,
          createdAt: now,
          updatedAt: now
        };
      }
      
      const index = notes[currentCategory].findIndex(n => n.id === note.id);
      if (index >= 0) {
        notes[currentCategory][index] = note;
      } else {
        notes[currentCategory].unshift(note);
      }
      
      notes[currentCategory].sort((a, b) => b.updatedAt - a.updatedAt);
      currentNoteId = note.id;
      saveToLocalStorage();
      updateUI();
      showToast('Beleška sačuvana!');
    }

    function deleteNote() {
      if (!currentNoteId) {
        showToast('Nema beleške za brisanje');
        return;
      }
      
      notes[currentCategory] = notes[currentCategory].filter(n => n.id !== currentNoteId);
      currentNoteId = null;
      currentText = '';
      document.getElementById('editor').value = '';
      saveToLocalStorage();
      updateUI();
      showToast('Beleška obrisana');
    }

    function newNote() {
      currentNoteId = null;
      currentText = '';
      document.getElementById('editor').value = '';
      updateUI();
      document.getElementById('editor').focus();
    }

    function exportNote() {
      if (!currentText.trim()) {
        showToast('Nema teksta za izvoz');
        return;
      }
      const blob = new Blob([currentText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `beleska-${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('TXT fajl preuzet');
    }

    async function shareNote() {
      if (!currentText.trim()) {
        showToast('Nema teksta za deljenje');
        return;
      }
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Beleška', text: currentText });
        } catch(e) {}
      } else {
        await navigator.clipboard.writeText(currentText);
        showToast('Tekst kopiran');
      }
    }

    function searchNotes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const resultsDiv = document.getElementById('searchResults');
      
      if (!query.trim()) {
        resultsDiv.innerHTML = '';
        return;
      }
      
      const all = [...notes.licno, ...notes.dokumenta];
      const filtered = all.filter(n => n.text.toLowerCase().includes(query));
      
      if (filtered.length === 0) {
        resultsDiv.innerHTML = '<div style="padding: 16px; text-align: center;">Nema rezultata</div>';
      } else {
        resultsDiv.innerHTML = filtered.map(n => `
          <div class="search-result" data-id="${n.id}" data-cat="${n.category}">
            <div style="font-size: 12px; color: #3b82f6; margin-bottom: 4px;">${n.category === 'licno' ? '📁 Lično' : '📄 Dokumenta'}</div>
            <div style="font-size: 13px;">${escapeHtml(n.text.substring(0, 80))}</div>
          </div>
        `).join('');
        
        document.querySelectorAll('.search-result').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.dataset.id;
            const cat = el.dataset.cat;
            if (cat !== currentCategory) {
              currentCategory = cat;
            }
            const note = notes[currentCategory].find(n => n.id === id);
            if (note) {
              currentNoteId = note.id;
              currentText = note.text;
              document.getElementById('editor').value = currentText;
              updateUI();
            }
            closeSearch();
          });
        });
      }
    }

    function openSearch() {
      document.getElementById('searchOverlay').classList.add('open');
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
      document.getElementById('searchInput').focus();
    }

    function closeSearch() {
      document.getElementById('searchOverlay').classList.remove('open');
    }

    function setTheme(newTheme) {
      theme = newTheme;
      localStorage.setItem('theme', theme);
      const themes = {
        dark: { bg: '#0f172a', surface: '#1e293b', text: '#f1f5f9', border: '#334155' },
        light: { bg: '#f8fafc', surface: '#ffffff', text: '#0f172a', border: '#e2e8f0' },
        neon: { bg: '#0a0a1a', surface: '#1a1a3a', text: '#e0e0ff', border: '#3a3a5a' }
      };
      const t = themes[newTheme];
      document.body.style.background = t.bg;
      document.body.style.color = t.text;
      document.querySelectorAll('.category, .notes-list, textarea, .tool-btn, .search-box, .toast').forEach(el => {
        el.style.background = t.surface;
        el.style.borderColor = t.border;
      });
    }

    // ==================== INIT ====================
    function init() {
      loadFromLocalStorage();
      
      // Set initial note if exists
      const currentNotes = notes[currentCategory];
      if (currentNotes.length > 0 && !currentNoteId) {
        currentNoteId = currentNotes[0].id;
        currentText = currentNotes[0].text;
        document.getElementById('editor').value = currentText;
      }
      
      updateUI();
      setTheme(theme);
      
      // Event listeners
      document.getElementById('editor').addEventListener('input', (e) => {
        currentText = e.target.value;
        updateUI();
      });
      
      document.getElementById('saveBtn').addEventListener('click', saveNote);
      document.getElementById('deleteBtn').addEventListener('click', deleteNote);
      document.getElementById('exportBtn').addEventListener('click', exportNote);
      document.getElementById('shareBtn').addEventListener('click', shareNote);
      document.getElementById('searchBtn').addEventListener('click', openSearch);
      
      document.getElementById('notesToggle').addEventListener('click', () => {
        const items = document.getElementById('notesItems');
        items.classList.toggle('open');
        document.getElementById('notesToggle').textContent = items.classList.contains('open') ? '▲' : '▼';
      });
      
      document.querySelectorAll('.category').forEach(el => {
        el.addEventListener('click', () => {
          const cat = el.dataset.cat;
          if (cat !== currentCategory) {
            currentCategory = cat;
            currentNoteId = null;
            currentText = '';
            document.getElementById('editor').value = '';
            updateUI();
          }
        });
      });
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => setTheme(btn.dataset.theme));
      });
      
      document.getElementById('searchInput').addEventListener('input', searchNotes);
      document.getElementById('searchOverlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('searchOverlay')) closeSearch();
      });
      
      // Auto-save on blur
      document.getElementById('editor').addEventListener('blur', () => {
        if (currentText.trim() && (currentNoteId || currentText !== '')) {
          saveNote();
        }
      });
    }
    
    init();
  </script>
</body>
</html>
